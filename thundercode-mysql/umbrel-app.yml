manifestVersion: 1
id: thundercode-mysql
name: MySQL Server + phpMyAdmin
tagline: MySQL database with a web management interface
icon: https://www.phpmyadmin.net/static/images/logo-og.png
category: Development
version: "1.0.6"
port: 8090
description: >-
  A MySQL 8 server for your Umbrel with phpMyAdmin included. Login to
  phpMyAdmin with root + your password and manage your databases from the
  web interface. Perfect as a database for your Minecraft server.
developer: ThunderCode
website: https://www.phpmyadmin.net
submitter: ThunderCode
submission: https://github.com/Spox-code/umbrel-os-db
repo: https://github.com/Spox-code/umbrel-os-db
support: https://github.com/Spox-code/umbrel-os-db/issues
gallery:
  - https://www.phpmyadmin.net/images/screenshots/1_interface.png
  - https://www.mysql.com/common/logos/logo-mysql-170x115.png
  - https://www.phpmyadmin.net/images/screenshots/1_interface.png
releaseNotes: >-
  Fixed: MySQL now always starts even when no password is provided in the
  setup (falls back to root/changeme). Also connects phpMyAdmin to the full
  container name.
dependencies: []
path: ""
defaultUsername: "root"
defaultPassword: ""
environmentVariables:
  - id: MYSQL_ROOT_PASSWORD
    name: MySQL root password
    description: Password for the MySQL root user. Only used on first start.
    default: "changeme"
    required: true
  - id: MYSQL_DATABASE
    name: MySQL database name
    description: Name of the database created on first start.
    default: "umbrel"
    required: false
  - id: MYSQL_USER
    name: MySQL username
    description: User account created on first start.
    default: "umbrel"
    required: false
  - id: MYSQL_PASSWORD
    name: MySQL user password
    description: Password for the user account above.
    default: "changeme"
    required: false
