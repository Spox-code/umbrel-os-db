version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: thundercode-mysql_phpmyadmin_1
      APP_PORT: 80

  mysql:
    image: mysql:8.0
    restart: on-failure
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_SEED_MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${APP_SEED_MYSQL_DATABASE:-umbrel}
      MYSQL_USER: ${APP_SEED_MYSQL_USER:-umbrel}
      MYSQL_PASSWORD: ${APP_SEED_MYSQL_PASSWORD:-changeme}
    volumes:
      - ${APP_DATA_DIR}/mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: on-failure
    depends_on:
      - mysql
    environment:
      PMA_HOST: thundercode-mysql_mysql_1
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
